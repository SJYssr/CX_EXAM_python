# C# 版本超星考试客户端配置文件

# AI 服务类型设置
AI_set:
  # AI服务类型: 0=未设置, 1=Spark, 2=Deepseek
  type: 2

# 题库路径配置
PATH:
  # 题库文件路径
  path: "tiku.txt"

# 讯飞星火AI配置
SPARK:
  # WebSocket URL
  Spark_url: "wss://spark-api.xf-yun.com/v3.5/chat"
  # API密钥
  api_key: "your_spark_api_key_here"
  # API密钥
  api_secret: "your_spark_api_secret_here"
  # 应用ID
  appid: "your_spark_app_id_here"
  # 模型域名
  domain: "generalv3.5"

# Deepseek AI配置 - 腾讯云免费版本（2025年2月前免费）
deepseek:
  # API密钥 - 需要去腾讯云申请：https://console.cloud.tencent.com/lke
  # 注册腾讯云账号 -> 开通大模型知识引擎 -> 创建API密钥
  api_key: "sk-请替换为腾讯云申请的API密钥"
  # 模型名称
  model: "deepseek-chat"
  # API地址 - 腾讯云免费API地址
  api_url: "https://api.lkeap.cloud.tencent.com/v1" 